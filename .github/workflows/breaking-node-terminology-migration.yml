name: Breaking Node terminology migration

on:
  push:
    branches:
      - refactor/canonical-node-terminology-v2

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/canonical-node-terminology-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install validation dependencies
        run: python -m pip install -e '.[render,dev]'
      - name: Apply breaking terminology migration
        run: python tools/breaking_node_terminology_migration.py
      - name: Normalize imports and formatting
        run: |
          python -m ruff check . --fix
          python -m ruff format .
      - name: Verify no active Cell vocabulary remains
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '(^|[^A-Za-z])(Cell|Cells|cell|cells)([^A-Za-z]|$)|slots_per_cell|max_particles_per_cell|DisturbanceCell|SpatialCell|CellView|CellState|LinkCell|StreamCell|cell_contract|test_cell_state_contract' -- ':!tests/reference/**' ':!docs/VALIDATION.md' ':!tools/breaking_node_terminology_migration.py'; then
            echo 'Old Cell vocabulary remains in active files.' >&2
            exit 1
          fi
      - name: Run full validation
        run: python tools/check.py --base origin/main --full
      - name: Remove one-shot migration machinery
        run: |
          rm tools/breaking_node_terminology_migration.py
          rm .github/workflows/breaking-node-terminology-migration.yml
      - name: Commit migrated tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor!: remove Cell compatibility vocabulary'
          git push origin HEAD:refactor/canonical-node-terminology-v2
