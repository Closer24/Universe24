name: Quantum integration validation
on:
  push:
    branches: [feat/deferred-quantum-events]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Apply checksum-pinned integration patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess
          parts = ['5571758d5b0aa9ff3b51ec3a4e9481f1aea1c0e6', '626b3b4e50217a0ab67a027e6f0202e949b9c435', '325aa28a2d0afa9e02b35f83b7925634bc7c1872', '8cc444dfca352bd6cc7118ba17954319410661dc']
          payload = b''
          for sha in parts:
              obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/Closer24/Universe24/git/blobs/' + sha]))
              part = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              payload += part
          assert hashlib.sha256(payload).hexdigest() == '35f02a76720bbd1da0cd1344f091eedd1f730744853b8e614d5b09512ea71d24'
          out = pathlib.Path('artifacts/quantum-integration')
          out.mkdir(parents=True, exist_ok=True)
          patch = out / 'integration.patch'
          patch.write_bytes(gzip.decompress(payload))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          source = pathlib.Path('src/event_universe/quantum/event_network.py')
          text = source.read_text()
          old = '        sites = (site,)\n'
          assert text.count(old) == 1
          source.write_text(text.replace(old, '        sites: tuple[int, ...] = (site,)\n'))
          allowed = {'POSTULATES.md', 'SIMULATOR_DEFINITIONS.md', 'docs/ARCHITECTURE.md', 'docs/QUANTUM_EVENTS.md', 'docs/TEST_EXPECTATIONS.md', 'src/event_universe/integration/quantum_event_trial.py', 'src/event_universe/quantum/__init__.py', 'src/event_universe/quantum/deferred.py', 'src/event_universe/quantum/event_network.py', 'src/event_universe/quantum/event_rules.py', 'tests/test_quantum_event_network.py', 'tests/test_quantum_event_trial.py'}
          subprocess.run(['git', 'add', '--', *sorted(allowed)], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == allowed, changed
          (out / 'python-version.txt').write_text(subprocess.check_output(['python', '--version'], text=True))
          PY
      - name: Project gate on Python 3.14
        run: |
          set -o pipefail
          python tools/check.py --base 12c85316f011d0601adcd0f4a31f0f52e59eaa27 2>&1 | tee artifacts/quantum-integration/check.log
      - name: Reproducible affected trials
        run: |
          python -m event_universe.integration.quantum_event_trial --ticket 24 > artifacts/quantum-integration/trial-occupied.json
          python -m event_universe.integration.quantum_event_trial --ticket 0 > artifacts/quantum-integration/trial-empty.json
      - name: Publish only the validated source files
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/deferred-quantum-events | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate deferred quantum event network with conditional records'
          git push origin HEAD:refs/heads/feat/deferred-quantum-events
          git rev-parse HEAD > artifacts/quantum-integration/published-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-integration-validation
          path: artifacts/
          retention-days: 1
