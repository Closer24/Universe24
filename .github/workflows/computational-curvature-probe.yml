name: Computational curvature probe
on:
  push:
    branches: [experiment/computational-curvature-20260912]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Validate experiment source
        run: |
          python -m ruff check examples/computational-curvature/measure.py examples/computational-curvature/measure_steady_state.py
          python -m ruff format --check examples/computational-curvature/measure.py examples/computational-curvature/measure_steady_state.py
      - name: Run five measured worlds with HTML playback
        run: python examples/computational-curvature/measure.py --output artifacts/computational-curvature
      - name: Run established-field clock probe with HTML playback
        run: python examples/computational-curvature/measure_steady_state.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: computational-curvature-probe
          path: |
            artifacts/computational-curvature/
            artifacts/computational-curvature-steady/
          retention-days: 2
