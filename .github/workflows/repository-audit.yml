name: Repository consistency audit
on:
  push:
    branches: [chore/repository-consistency-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply reviewed changes and preserve concurrent integration
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/repository-consistency-audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit 7e451fff1e44dfc3bef21c4a166326a3ba6c3b0d
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import tempfile
          root = pathlib.Path.cwd()
          pieces = []
          for sha in ('3d6e6acaa1744fe55adbe137fb67cc595d845526', 'adf25bc0dee7e2a55d2178003b8342585f039cad', '6b2f77219a9186feb0dd3df4a51faae9769b6dd9'):
              reply = json.loads(subprocess.check_output(['gh', 'api', f'repos/Closer24/Universe24/git/blobs/{sha}']))
              pieces.append(base64.b64decode(reply['content']).decode())
          data = lzma.decompress(base64.b64decode(''.join(pieces)))
          assert hashlib.sha256(data).hexdigest() == 'e1698490d59ac0e89633fd5badc2826e16990afeadb456d217ca37d699b4d731'
          payload = json.loads(data)
          assert payload['base'] == '2e753fed1f6922d9d2082d6d43c9e150f237bdd6'
          assert payload['integrate'] == '7e451fff1e44dfc3bef21c4a166326a3ba6c3b0d'
          def checked_path(name):
              path = root / name
              assert path.resolve().is_relative_to(root) and '.git' not in path.parts
              assert not name.startswith('tests/reference/')
              return path
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          for change in payload['changes']:
              target = checked_path(change.get('target', change.get('source')))
              if 'source' not in change:
                  assert not target.exists(), target
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(change['content'], encoding='utf-8')
                  continue
              source = checked_path(change['source'])
              original = subprocess.check_output(['git', 'show', payload['base'] + ':' + change['source']])
              current = source.read_bytes()
              if change.get('delete'):
                  assert current == original, source
                  source.unlink()
                  continue
              lines = original.decode().splitlines(keepends=True)
              for start, stop, replacement in reversed(change['edits']):
                  lines[start:stop] = [replacement]
              desired = ''.join(lines).encode()
              if current != original:
                  replacement_sha = payload['replace_current'].get(change['source'])
                  if replacement_sha is not None:
                      assert blob(current) == replacement_sha, 'Concurrent status changed again'
                  else:
                      with tempfile.TemporaryDirectory() as folder:
                          paths = [pathlib.Path(folder) / name for name in ('current', 'base', 'desired')]
                          for path, content in zip(paths, (current, original, desired), strict=True):
                              path.write_bytes(content)
                          merge = subprocess.run(['git', 'merge-file', '-p', *map(str, paths)], capture_output=True)
                          if merge.returncode:
                              raise RuntimeError('Unresolved concurrent edit: ' + str(source) + '\n' + merge.stdout.decode())
                          desired = merge.stdout
              if source != target:
                  assert not target.exists(), target
                  source.unlink()
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(desired)
          # This task-specific transport workflow is not part of the delivered project.
          (root / '.github/workflows/repository-audit.yml').unlink()
          assert subprocess.check_output(['git', 'diff', payload['base'], '--', 'tests/reference']) == b''
          print('Applied 69 reviewed changes; preserved the integrated small-space experiment files.')
          PY
      - run: python -m pip install -e '.[render,dev]'
      - name: Normalize import order and formatting
        run: |
          python -m ruff check --select I --fix .
          python -m ruff format .
          git diff --check
      - name: Verify unchanged executable production logic
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import re
          import subprocess
          base = '2e753fed1f6922d9d2082d6d43c9e150f237bdd6'
          names = {'api.py': 'particle_api.py', 'engine.py': 'scalar_engine.py', 'current_field.py': 'scalar_field.py', 'scenarios.py': 'particle_scenarios.py'}
          substitutions = [('event_universe.api', 'event_universe.particle_api'), ('event_universe.scenarios', 'event_universe.particle_scenarios'), ('core.engine', 'core.scalar_engine'), ('models.current_field', 'models.scalar_field'), ('CurrentFieldModel', 'ScalarFieldModel'), ('CURRENT_MODEL', 'SCALAR_MODEL'), ('from .api import', 'from .particle_api import'), ('".api"', '".particle_api"'), ('from .engine import', 'from .scalar_engine import'), ('from .scenarios import', 'from .particle_scenarios import'), ('from .current_field import', 'from .scalar_field import')]
          def normalized(text):
              for old, new in substitutions:
                  text = text.replace(old, new)
              tree = ast.parse(re.sub(r'\bEngine\b', 'ScalarEngine', text))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.body and isinstance(node.body[0], ast.Expr) and isinstance(node.body[0].value, ast.Constant) and isinstance(node.body[0].value.value, str):
                          node.body.pop(0)
              imports = [n for n in tree.body if isinstance(n, (ast.Import, ast.ImportFrom))]
              rest = [n for n in tree.body if not isinstance(n, (ast.Import, ast.ImportFrom))]
              tree.body = sorted(imports, key=ast.dump) + rest
              return ast.dump(tree, include_attributes=False)
          count = 0
          for name in subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', base, 'src'], text=True).splitlines():
              path = pathlib.Path(name)
              if path.suffix != '.py':
                  continue
              target = path.with_name(names.get(path.name, path.name))
              previous = subprocess.check_output(['git', 'show', base + ':' + name], text=True)
              assert normalized(previous) == normalized(target.read_text()), name
              count += 1
          print(f'PASS: executable AST preserved in all {count} production Python modules after explicit name mapping.')
          PY
      - name: Complete submitted-tree audit
        run: python tools/check.py --base 7e451fff1e44dfc3bef21c4a166326a3ba6c3b0d --full
      - name: Build and inspect distribution names
        run: |
          python -m build --outdir "$RUNNER_TEMP/distribution"
          python - <<'PY'
          import os
          import pathlib
          import zipfile
          wheel = next((pathlib.Path(os.environ['RUNNER_TEMP']) / 'distribution').glob('*.whl'))
          with zipfile.ZipFile(wheel) as package:
              names = set(package.namelist())
          for name in ('event_universe/particle_api.py', 'event_universe/particle_scenarios.py', 'event_universe/core/scalar_engine.py', 'event_universe/models/scalar_field.py'):
              assert name in names, name
          for name in ('event_universe/api.py', 'event_universe/scenarios.py', 'event_universe/core/engine.py', 'event_universe/models/current_field.py'):
              assert name not in names, name
          print('PASS: source and wheel names agree; old implementation paths are absent.')
          PY
      - name: Preserve exact checked source
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/repository-audit"
          git add -A
          tree=$(git write-tree)
          echo "$tree" > "$RUNNER_TEMP/repository-audit/tree.txt"
          git archive --format=tar "$tree" | gzip > "$RUNNER_TEMP/repository-audit/source.tar.gz"
          git diff --cached 7e451fff1e44dfc3bef21c4a166326a3ba6c3b0d > "$RUNNER_TEMP/repository-audit/cleanup.diff"
          cp artifacts/junit.xml artifacts/check-scope.json "$RUNNER_TEMP/repository-audit/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-audit-reviewed
          path: ${{ runner.temp }}/repository-audit/
          retention-days: 1
      - name: Publish checked changes on the isolated audit branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/chore/repository-consistency-audit
          test ! -e .github/workflows/repository-audit.yml
          gh auth setup-git
          git commit -m 'chore: clarify historical names and enforce canonical repository ownership'
          git push origin HEAD:refs/heads/chore/repository-consistency-audit
