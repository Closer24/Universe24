name: Integrated repository delivery audit
on:
  push:
    branches: [chore/repository-consistency-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Integrate reviewed main without dropping either side's additions
        run: |
          test "$GITHUB_REF" = refs/heads/chore/repository-consistency-audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import difflib
          import pathlib
          import subprocess
          base = '99b9f5f0034ea288f7de0a2a8d7645220c45d8aa'
          ancestor = 'fb083c159fe1f51612203962d9a7921683eb31c8'
          result = subprocess.run(['git', 'merge', '--no-ff', '--no-commit', base])
          assert result.returncode in (0, 1)
          conflicts = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()
          def version(revision, path):
              return subprocess.check_output(['git', 'show', revision + ':' + path], text=True)
          for name in conflicts:
              if name == 'docs/PROJECT_STATUS.md':
                  continue
              assert name in {'docs/TEST_EXPECTATIONS.md', 'tests/test_check_scope.py', 'docs/ARCHITECTURE.md', 'skills/regression-check/SKILL.md'}, name
              original = version(ancestor, name).splitlines(keepends=True)
              incoming = version(base, name).splitlines(keepends=True)
              ours = version('HEAD', name).splitlines(keepends=True)
              incoming_edits = difflib.SequenceMatcher(None, original, incoming, autojunk=False).get_opcodes()
              assert all(tag in ('equal', 'insert') for tag, *_ in incoming_edits), 'Non-additive conflict needs review: ' + name
              matches = difflib.SequenceMatcher(None, original, ours, autojunk=False).get_matching_blocks()
              insertions = []
              for tag, start, stop, new_start, new_stop in incoming_edits:
                  if tag == 'equal':
                      continue
                  if start == len(original):
                      position = len(ours)
                  else:
                      anchors = [m.b + start - m.a for m in matches if m.a <= start < m.a + m.size]
                      assert len(anchors) == 1, 'Ambiguous insertion anchor: ' + name
                      position = anchors[0]
                  insertions.append((position, incoming[new_start:new_stop]))
              for position, lines in reversed(insertions):
                  ours[position:position] = lines
              pathlib.Path(name).write_text(''.join(ours), encoding='utf-8')
              subprocess.run(['git', 'add', name], check=True)
          path = pathlib.Path('docs/PROJECT_STATUS.md')
          text = version('HEAD', str(path)).replace(ancestor, base)
          anchor = '| Historical particle APIs |'
          assert anchor in text
          rows = '''| Shared integer arithmetic | [integer.py](../src/event_universe/core/integer.py) | Shared bounded integer primitives; expression evaluation retains its separate owner |
          | Local E/B pulse candidate | [local impulse contract](LOCAL_LORENTZ_FIELD.md) | Held one-shot probes, finite pulse transport and an opposite local reservoir; not derived Maxwell dynamics |
          | Formula-free state diagnostic | [cell_contract.py](../src/event_universe/diagnostics/cell_contract.py) | Read-only structural guard for state ownership; host diagnostics are not physical updates |
          | Standalone vector laboratory | [laboratory guide](../tools/generic_vector_lab/README.md) | Separate research/reference process, not the active generic Simulation |
          '''
          text = text.replace(anchor, rows + anchor)
          first = text.index('As of the audit reference, PRs #31, #33, #37 and #38 are separate unmerged work:')
          last = text.index('Historical integration chronology remains', first)
          text = text[:first] + '''The audit reference now includes the standalone vector laboratory, shared bounded
          arithmetic, the local E/B pulse and formula-free cell-state guard, and the
          Highlights/recovery documentation. Their appearance in the checkout does not
          promote reference experiments into the active physical engine. The
          [Highlights coverage record](HIGHLIGHTS_IMPLEMENTATION.md) preserves its stated
          historical revision; use this map and current contracts for later additions.
          Consult [live PRs](https://github.com/Closer24/Universe24/pulls) for any subsequent
          work rather than inferring integration from a branch description.
          ''' + text[last:]
          path.write_text(text, encoding='utf-8')
          subprocess.run(['git', 'add', str(path)], check=True)
          def replace(name, old, new):
              target = pathlib.Path(name)
              text = target.read_text(encoding='utf-8')
              assert old in text, name
              target.write_text(text.replace(old, new, 1), encoding='utf-8')
          replace('docs/README.md', '| [Local field rules](LOCAL_FIELD_RULES.md)', '| [Local field impulse](LOCAL_LORENTZ_FIELD.md) | Configured one-shot E/B pulse and read-only formula-free-state guard |\n| [Local field rules](LOCAL_FIELD_RULES.md)')
          replace('docs/README.md', '| [Project status](PROJECT_STATUS.md)', '| [Highlights coverage](HIGHLIGHTS_IMPLEMENTATION.md) | Dated implementation inventory and specification coverage, not a live status feed |\n| [Recovery](RECOVERY.md) | Restore a checkout, environment and authorized operational procedures without chat history |\n| [Project status](PROJECT_STATUS.md)')
          replace('docs/HIGHLIGHTS_IMPLEMENTATION.md', '## 10. Implemented entities and rules', 'This is a dated inventory for the revision above. Later native event programs,\nlocal probes and internal path changes are described in [project status](PROJECT_STATUS.md),\n[the documentation index](README.md) and [migration](MIGRATION.md). Preserve this\nrecord as historical evidence rather than treating its omissions as current gaps.\n\n## 10. Implemented entities and rules')
          replace('CONTRIBUTING.md', '   reusable generic arithmetic;', '   initialization-defined expression evaluation; shared bounded arithmetic belongs\n   in `core/integer.py`;')
          # Migrate only known historical paths newly reintroduced by old branches.
          replacements = [('event_universe.api', 'event_universe.particle_api'), ('event_universe.scenarios', 'event_universe.particle_scenarios'), ('core/engine.py', 'core/scalar_engine.py'), ('models/current_field.py', 'models/scalar_field.py'), ('src/event_universe/api.py', 'src/event_universe/particle_api.py'), ('src/event_universe/scenarios.py', 'src/event_universe/particle_scenarios.py'), ('test_current_field.py', 'test_scalar_field_model.py'), ('test_engine.py', 'test_scalar_engine.py'), ('test_application.py', 'test_legacy_application.py'), ('docs/FIELDS.md', 'docs/SCALAR_FIELDS.md'), ('](FIELDS.md)', '](SCALAR_FIELDS.md)'), ('examples/known-entities/run.py', 'examples/known-entities/run_reference_checks.py'), ('examples/known-entities/run.ps1', 'examples/known-entities/run_reference_checks.ps1')]
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              target = pathlib.Path(name)
              if not target.is_file() or target.suffix not in ('.py', '.md', '.ps1', '.json'):
                  continue
              if name.startswith('tests/reference/') or name in {'docs/MIGRATION.md', 'docs/VALIDATION.md'}:
                  continue
              text = target.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if text != updated:
                  target.write_text(updated, encoding='utf-8')
          pathlib.Path('.github/workflows/repository-audit.yml').unlink()
          assert subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U']) == b''
          assert subprocess.check_output(['git', 'diff', base, '--', 'tests/reference']) == b''
          PY
      - run: python -m pip install -e '.[render,dev]'
      - name: Format and compare all production logic with integrated main
        run: |
          python -m ruff check --select I --fix .
          python -m ruff format .
          python - <<'PY'
          import subprocess
          import textwrap
          # Reuse the already validated audit script, pinned to its Git revision.
          workflow = subprocess.check_output(['git', 'show', 'fb5f497ec74a8230510b2aa4d3de1113bf4004b1:.github/workflows/repository-audit.yml'], text=True)
          section = workflow.split('      - name: Verify production logic is unchanged from integrated main after name mapping\n', 1)[1].split('      - name: Complete submitted-tree audit\n', 1)[0]
          script = textwrap.dedent(section.split('        run: |\n', 1)[1])
          script = script.replace('fb083c159fe1f51612203962d9a7921683eb31c8', '99b9f5f0034ea288f7de0a2a8d7645220c45d8aa')
          subprocess.run(['bash', '-e', '-c', script], check=True)
          PY
          git diff --check
      - name: Complete integrated-tree validation
        run: python tools/check.py --base 99b9f5f0034ea288f7de0a2a8d7645220c45d8aa --full
      - name: Preserve exact submitted source and results
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/repository-audit"
          git add -A
          tree=$(git write-tree)
          echo "$tree" > "$RUNNER_TEMP/repository-audit/tree.txt"
          git archive --format=tar "$tree" | gzip > "$RUNNER_TEMP/repository-audit/source.tar.gz"
          git diff --cached 99b9f5f0034ea288f7de0a2a8d7645220c45d8aa > "$RUNNER_TEMP/repository-audit/cleanup.diff"
          cp artifacts/junit.xml artifacts/check-scope.json "$RUNNER_TEMP/repository-audit/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-audit-integrated
          path: ${{ runner.temp }}/repository-audit/
          retention-days: 1
      - name: Publish only the successfully checked audit branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/chore/repository-consistency-audit
          test ! -e .github/workflows/repository-audit.yml
          gh auth setup-git
          git commit -m 'chore: preserve parallel integrations and reconcile the current ownership map'
          git push origin HEAD:refs/heads/chore/repository-consistency-audit
