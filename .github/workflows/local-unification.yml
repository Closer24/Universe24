name: Local carrier-record unification
on:
  pull_request:
    paths:
      - 'validation/local_unification/**'
      - 'universe24/tests/test_local_unification*.py'
      - 'docs/research/local_unification/**'
      - '.github/workflows/local-unification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-local-law:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[validation]'
      - name: Run independent local-law regression controls
        run: python -m unittest discover -s universe24/tests -t . -p 'test_local_unification*.py' -v
      - name: Reproduce source-bound proofs and saved-runtime evidence
        run: python -m validation.local_unification.run_all --out runs/local-unification-ci
      - name: Verify the unchanged generic runtime
        run: |
          python -m validation.system_smoke --out runs/local-unification-smoke
          python -m universe24 verify --run runs/local-unification-smoke/run
      - name: Save complete evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-unification-python-${{ matrix.python }}
          path: |
            runs/local-unification-ci/
            runs/local-unification-smoke/
          if-no-files-found: error
