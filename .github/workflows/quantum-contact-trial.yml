name: Quantum contact trial
on:
  workflow_dispatch:
  push:
    branches: [main, feat/quantum-contact-trial]
    paths:
      - src/event_universe/integration/quantum_contact_trial.py
      - examples/quantum/contact.json
      - tests/test_quantum_contact_trial.py
      - .github/workflows/quantum-contact-trial.yml
  pull_request:
    paths:
      - src/event_universe/integration/quantum_contact_trial.py
      - examples/quantum/contact.json
      - tests/test_quantum_contact_trial.py
      - .github/workflows/quantum-contact-trial.yml
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Verify the finite contact contract
        run: python -m pytest tests/test_quantum_contact_trial.py --junitxml=artifacts/contact-evidence/junit.xml
      - name: Run both measured outcomes
        run: |
          python -m event_universe.integration.quantum_contact_trial --init examples/quantum/contact.json --output artifacts/contact-evidence/reflection --ticket 24 --visualize
          python -m event_universe.integration.quantum_contact_trial --init examples/quantum/contact.json --output artifacts/contact-evidence/transmission --ticket 0 --visualize
          git rev-parse HEAD > artifacts/contact-evidence/git-head.txt
          python --version > artifacts/contact-evidence/python-version.txt
          git archive HEAD | gzip > artifacts/contact-evidence/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quantum-contact-evidence
          path: artifacts/contact-evidence/
          retention-days: 1
