name: Python checks
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CHECK_BASE: ${{ github.base_ref && format('origin/{0}', github.base_ref) || github.event.before }}
  PR_BODY: ${{ github.event.pull_request.body }}
# no world replays in CI (the owner's decision of 2026-09-27): the test suites alone, in shards
jobs:
  plan:
    # no run on a draft's pushes; marking it ready runs it
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - id: plan
        run: python tools/check.py --base "$CHECK_BASE" --plan >> "$GITHUB_OUTPUT"
  check:
    needs: plan
    name: ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the owner's ceiling (2026-10-02): a run over ten minutes fails by name
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python tools/check.py --shard "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics-${{ strategy.job-index }}
          path: artifacts/
          retention-days: 1
