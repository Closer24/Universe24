name: Python checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: python-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - run: python tools/check.py
      - run: python -m event_universe --scenario contact --output artifacts/contact
      - run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostics
          path: artifacts/
