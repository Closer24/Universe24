name: Native event integration validation
on:
  push:
    branches: [feat/native-causal-quantum]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Merge the exact concurrent main revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python - <<'PY'
          import pathlib, subprocess
          base = '2e753fed1f6922d9d2082d6d43c9e150f237bdd6'
          main = '7e451fff1e44dfc3bef21c4a166326a3ba6c3b0d'
          merged = subprocess.run(['git', 'merge', '--no-commit', '--no-ff', main])
          unresolved = set(subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines())
          assert merged.returncode in (0,1) and unresolved <= {'tools/check.py'}, unresolved
          if unresolved:
              def read(ref):
                  return subprocess.check_output(['git', 'show', ref + ':tools/check.py'], text=True)
              before, ours, theirs = read(base), read('HEAD'), read(main)
              anchor = 'RESOURCE_CONSUMERS = {\n'
              additions = ''.join('    "' + filename + '": ("tests/test_small_space_experiments.py",),\n' for filename in ['examples/small-space/experiments.py', 'examples/small-space/source-pulse.json', 'examples/small-space/source-response.json', 'examples/known-entities/catalog.json', 'examples/known-entities/discrete-pair.json'])
              assert theirs == before.replace(anchor, anchor + additions, 1)
              assert 'examples/small-space/experiments.py' not in ours
              pathlib.Path('tools/check.py').write_text(ours.replace(anchor, anchor + additions, 1))
              subprocess.run(['git', 'add', 'tools/check.py'], check=True)
          assert not subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U'], text=True).strip()
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          out = pathlib.Path('artifacts/native-integration'); out.mkdir(parents=True, exist_ok=True)
          (out / 'python.txt').write_text(subprocess.check_output(['python', '--version'], text=True))
          PY
      - name: Required project checks on the integrated tree
        run: |
          set -o pipefail
          python tools/check.py --base 7e451fff1e44dfc3bef21c4a166326a3ba6c3b0d 2>&1 | tee artifacts/native-integration/check.log
      - name: Repeat canonical native runs after integration
        run: |
          python -m event_universe --init examples/quantum/native_classical.json --output artifacts/native-integration/classical --visualize
          python -m event_universe --init examples/quantum/native_quantum.json --output artifacts/native-integration/quantum --visualize
          python -m event_universe --init examples/quantum/native_reflection.json --output artifacts/native-integration/reflection --visualize
          python -m event_universe --init examples/quantum/native_cost_delay.json --output artifacts/native-integration/cost-delay --visualize
          python - <<'PY'
          import json
          from pathlib import Path
          for name, cost, draws in [('classical',116,0), ('quantum',135,1), ('reflection',135,0), ('cost-delay',130,0)]:
              root = Path('artifacts/native-integration') / name
              run = json.loads((root / 'run.json').read_text())
              assert run['status'] == 'completed'
              assert run['source_sha256'] == '9137bbf78b85fdef7bb8cf306da5e2fb3b8dbb53efdc8410917eb27f025b0155'
              c = run['computation']
              assert c['model_operations_cost'] == c['event_ledger_cost'] == cost
              assert c['resolver']['random_draws'] == draws and c['resolver']['oracle_calls'] == 1
              assert c['resolver']['oracle_direct_world_ticks'] == 0
              for path in ('state.json','events.jsonl','causal-events.jsonl','run.html'):
                  assert (root/path).stat().st_size > 0
          PY
      - name: Publish the validated merge to the feature branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/native-causal-quantum | cut -f1)" = "$EXPECTED_HEAD"
          git commit -m 'Merge current main while preserving native quantum and small-space validation'
          git push origin HEAD:refs/heads/feat/native-causal-quantum
          git rev-parse HEAD > artifacts/native-integration/published-commit.txt
          git archive HEAD | gzip > artifacts/native-integration/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration-evidence
          path: artifacts/
          retention-days: 1
