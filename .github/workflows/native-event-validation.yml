name: Native event integration validation
on:
  push:
    branches: [feat/native-causal-quantum]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Verify the documented canonical CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess
          sha = 'c7197a675aed710070a31dd8c7795de1fa1c6180'
          obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/Closer24/Universe24/git/blobs/' + sha]))
          raw = base64.b64decode(obj['content'])
          assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
          patch_bytes = raw.replace(b'\n diff --git', b'\ndiff --git')
          assert hashlib.sha256(patch_bytes).hexdigest() == 'f57d8e273e985c36ebb7f24960f76535058773e1937d5aa0a594cc808706b986'
          out = pathlib.Path('artifacts/native-integration')
          out.mkdir(parents=True, exist_ok=True)
          patch = out / 'cli.patch'
          patch.write_bytes(patch_bytes)
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          allowed = ['docs/NATIVE_QUANTUM_EVENTS.md', 'tests/test_native_event_runtime.py']
          subprocess.run(['git', 'add', '--', *allowed], check=True)
          assert set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()) == set(allowed)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          (out / 'python.txt').write_text(subprocess.check_output(['python', '--version'], text=True))
          PY
      - name: Required affected project gate
        run: |
          set -o pipefail
          python tools/check.py --base 2e753fed1f6922d9d2082d6d43c9e150f237bdd6 2>&1 | tee artifacts/native-integration/check.log
      - name: Run through the canonical engine
        run: |
          python -m event_universe --init examples/quantum/native_classical.json --output artifacts/native-integration/classical --visualize
          python -m event_universe --init examples/quantum/native_quantum.json --output artifacts/native-integration/quantum --visualize
          python -m event_universe --init examples/quantum/native_reflection.json --output artifacts/native-integration/reflection --visualize
          python -m event_universe --init examples/quantum/native_cost_delay.json --output artifacts/native-integration/cost-delay --visualize
      - name: Require real run outputs and cost evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for name, cost, draws, tick in [('classical',116,0,4), ('quantum',135,1,4), ('reflection',135,0,4), ('cost-delay',130,0,15)]:
              root = Path('artifacts/native-integration') / name
              run = json.loads((root / 'run.json').read_text())
              assert run['status'] == 'completed', run
              report = run['computation']
              assert report['model_operations_cost'] == report['event_ledger_cost'] == cost, report
              assert report['resolver']['random_draws'] == draws
              assert report['resolver']['oracle_calls'] == 1
              assert report['resolver']['oracle_direct_world_ticks'] == 0
              assert report['resolver']['records'][0]['decision']['tick'] == tick
              for filename in ('state.json','events.jsonl','causal-events.jsonl','run.html'):
                  assert (root / filename).stat().st_size > 0, filename
          PY
      - name: Publish verified command and regression
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/native-causal-quantum | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix canonical CLI instructions and require actual native outputs'
          git push origin HEAD:refs/heads/feat/native-causal-quantum
          git rev-parse HEAD > artifacts/native-integration/published-commit.txt
          git archive HEAD | gzip > artifacts/native-integration/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration-evidence
          path: artifacts/
          retention-days: 1
