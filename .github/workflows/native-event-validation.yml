name: Native event integration validation
on:
  push:
    branches: [feat/native-causal-quantum]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Apply exact native integration patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          def read_blob(sha):
              obj = json.loads(subprocess.check_output(['gh', 'api', 'repos/Closer24/Universe24/git/blobs/' + sha]))
              part = base64.b64decode(obj['content'])
              assert hashlib.sha1(b'blob ' + str(len(part)).encode() + b'\0' + part).hexdigest() == sha
              return part
          parts = ['0da34538504f13d53d55ea7a62d2dfbb4b30d080', 'ca0ac11e967161fdbed41bbb44310e1c52c63f43']
          payload = b''.join(read_blob(sha) for sha in parts)
          assert hashlib.sha256(payload).hexdigest() == '686a43a7ba621dd45a78f2e06362b45cbd770fb1ae7a08315e3a70c4ad1ded34'
          out = pathlib.Path('artifacts/native-integration')
          out.mkdir(parents=True, exist_ok=True)
          patch = out / 'integration.patch'
          patch.write_bytes(lzma.decompress(payload))
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          fix = out / 'lazy-import.patch'
          fix.write_bytes(read_blob('e131ee591fc894f46926b07c9ee2e5d220c5b928'))
          subprocess.run(['git', 'apply', '--check', str(fix)], check=True)
          subprocess.run(['git', 'apply', str(fix)], check=True)
          allowed = '''POSTULATES.md SIMULATOR_DEFINITIONS.md docs/ARCHITECTURE.md docs/DISTURBANCES.md docs/NATIVE_QUANTUM_EVENTS.md docs/PROJECT_STATUS.md docs/TEST_EXPECTATIONS.md examples/quantum/native_classical.json examples/quantum/native_cost_delay.json examples/quantum/native_quantum.json examples/quantum/native_reflection.json src/event_universe/core/disturbance_engine.py src/event_universe/core/disturbance_state.py src/event_universe/core/event_resolution.py src/event_universe/core/event_space.py src/event_universe/disturbance_api.py src/event_universe/initialization.py src/event_universe/integration/event_program.py src/event_universe/integration/event_runtime.py src/event_universe/quantum/deferred.py src/event_universe/quantum/event_network.py src/event_universe/runner.py tests/test_native_event_runtime.py tools/check.py'''.split()
          subprocess.run(['git', 'add', '--', *allowed], check=True)
          changed = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert changed == set(allowed), changed
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          (out / 'python.txt').write_text(subprocess.check_output(['python', '--version'], text=True))
          PY
      - name: Required affected project gate
        run: |
          set -o pipefail
          python tools/check.py --base 2e753fed1f6922d9d2082d6d43c9e150f237bdd6 2>&1 | tee artifacts/native-integration/check.log
      - name: Run through the canonical engine
        run: |
          python -m event_universe.runner --init examples/quantum/native_classical.json --output artifacts/native-integration/classical --visualize
          python -m event_universe.runner --init examples/quantum/native_quantum.json --output artifacts/native-integration/quantum --visualize
          python -m event_universe.runner --init examples/quantum/native_reflection.json --output artifacts/native-integration/reflection
          python -m event_universe.runner --init examples/quantum/native_cost_delay.json --output artifacts/native-integration/cost-delay --visualize
      - name: Publish only validated integration sources
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/feat/native-causal-quantum | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate shared causal events and priced quantum outcomes into Simulation'
          git push origin HEAD:refs/heads/feat/native-causal-quantum
          git rev-parse HEAD > artifacts/native-integration/published-commit.txt
          git archive HEAD | gzip > artifacts/native-integration/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-integration-evidence
          path: artifacts/
          retention-days: 1
