name: Publish Newton output validation
on:
  push:
    branches: [test/newton-output-validation]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Apply reviewed external-only patch
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import lzma
          import subprocess
          encoded = '''
          
          
          
          '''
          patch = lzma.decompress(base64.b64decode(''.join(encoded.split()), validate=True))
          if hashlib.sha256(patch).hexdigest() != '0461bf4cbbe1f7d6ec151571ba813aafc11787233768f987ba61ac311c77f44a':
              raise RuntimeError('Reviewed patch fingerprint mismatch')
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          PY
          git rm .github/workflows/newton-output-evidence.yml
          git diff --cached --check
          test -z "$(git diff --name-only b0988512fa7f42a057c08dee7d6baa83cbf3eef7 -- src examples/04-unequal-mass-collision.json)"
      - name: Validate affected files
        run: python tools/check.py --base b0988512fa7f42a057c08dee7d6baa83cbf3eef7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newton-output-validation-checks
          path: |
            artifacts/check-scope.json
            artifacts/junit.xml
          retention-days: 1
      - name: Publish reviewed files on task branch
        run: |
          git config user.name Closer24
          git config user.email logic24@gmail.com
          git diff --cached --check
          git commit -m 'Add independent Newtonian acceptance on saved simulator output'
          git push origin HEAD:test/newton-output-validation
