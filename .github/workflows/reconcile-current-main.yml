name: Reconcile naming audit with current main
on:
  push:
    branches: [chore/repository-consistency-audit]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Merge current main and preserve naming ownership rules
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/repository-consistency-audit
          test "$(git rev-parse origin/main)" = 10e5221bc9c1d1f47311785e484b2870450dba45
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit -X theirs 10e5221bc9c1d1f47311785e484b2870450dba45
          test -z "$(git diff --name-only --diff-filter=U)"
          python - <<'PY'
          from pathlib import Path
          import subprocess

          root = Path.cwd()

          # Keep newly integrated example runners descriptive as well.
          runner_renames = (
              ('examples/particle-contracts/build.py', 'examples/particle-contracts/build_reference_configurations.py'),
          )
          for source, target in runner_renames:
              src = root / source
              dst = root / target
              if src.exists() and not dst.exists():
                  src.rename(dst)

          replacements = [
              ('event_universe.api', 'event_universe.particle_api'),
              ('event_universe.scenarios', 'event_universe.particle_scenarios'),
              ('core/engine.py', 'core/scalar_engine.py'),
              ('models/current_field.py', 'models/scalar_field.py'),
              ('src/event_universe/api.py', 'src/event_universe/particle_api.py'),
              ('src/event_universe/scenarios.py', 'src/event_universe/particle_scenarios.py'),
              ('test_current_field.py', 'test_scalar_field_model.py'),
              ('test_engine.py', 'test_scalar_engine.py'),
              ('test_application.py', 'test_legacy_application.py'),
              ('docs/FIELDS.md', 'docs/SCALAR_FIELDS.md'),
              ('](FIELDS.md)', '](SCALAR_FIELDS.md)'),
              ('examples/known-entities/run.py', 'examples/known-entities/run_reference_checks.py'),
              ('examples/known-entities/run.ps1', 'examples/known-entities/run_reference_checks.ps1'),
              ('examples/maxwell/run.py', 'examples/maxwell/run_experiments.py'),
              ('examples/small-space/run.py', 'examples/small-space/run_experiments.py'),
              ('examples/particle-contracts/build.py', 'examples/particle-contracts/build_reference_configurations.py'),
          ]
          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              path = root / name
              if not path.is_file() or path.suffix not in {'.py', '.md', '.ps1', '.json', '.yml', '.yaml', '.toml'}:
                  continue
              if name.startswith('tests/reference/') or name in {'docs/MIGRATION.md', 'docs/VALIDATION.md'}:
                  continue
              text = path.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated, encoding='utf-8')

          # Ensure the new rational-particle contract is discoverable from the documentation index.
          index = root / 'docs/README.md'
          text = index.read_text(encoding='utf-8')
          if 'RATIONAL_PARTICLES.md' not in text:
              anchor = '| [Physical entities](PHYSICAL_ENTITIES.md)'
              assert anchor in text
              text = text.replace(anchor, '| [Rational particle contracts](RATIONAL_PARTICLES.md) | Exact bounded ratio state, routing and particle-reference configurations |\n' + anchor, 1)
              index.write_text(text, encoding='utf-8')

          # Update only the audit's own current-main baseline; historical hashes stay historical.
          status = root / 'docs/PROJECT_STATUS.md'
          text = status.read_text(encoding='utf-8')
          heading = '## Repository naming and ownership audit'
          if heading in text:
              before, section = text.split(heading, 1)
              section = section.replace('85ec120862e5bead2c63eebfc37753b52497c0eb', '10e5221bc9c1d1f47311785e484b2870450dba45', 1)
              text = before + heading + section
          else:
              text = text.rstrip() + ('\n\n' + heading + '\n\n'
                  'The repository-wide naming/ownership audit is reconciled against main\n'
                  '`10e5221bc9c1d1f47311785e484b2870450dba45`. It preserves the integrated\n'
                  'native quantum, Maxwell and rational-particle additions while keeping one\n'
                  'active implementation owner per documented responsibility. Historical\n'
                  'research APIs and standalone laboratories remain explicitly labeled.\n')
          status.write_text(text.rstrip() + '\n', encoding='utf-8')

          # Temporary transport workflow must not enter the delivered tree.
          transport = root / '.github/workflows/reconcile-current-main.yml'
          if transport.exists():
              transport.unlink()

          assert subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=U']) == b''
          assert subprocess.check_output(['git', 'diff', '10e5221bc9c1d1f47311785e484b2870450dba45', '--', 'tests/reference']) == b''
          PY
      - run: python -m pip install -e '.[render,dev]'
      - name: Verify formatting and production behavior
        shell: bash
        run: |
          python -m ruff check --select I --fix .
          python -m ruff format .
          git diff --check
          python - <<'PY'
          import ast
          import pathlib
          import re
          import subprocess

          base = '10e5221bc9c1d1f47311785e484b2870450dba45'
          names = {'api.py': 'particle_api.py', 'engine.py': 'scalar_engine.py', 'current_field.py': 'scalar_field.py', 'scenarios.py': 'particle_scenarios.py'}
          substitutions = [
              ('event_universe.api', 'event_universe.particle_api'),
              ('event_universe.scenarios', 'event_universe.particle_scenarios'),
              ('core.engine', 'core.scalar_engine'),
              ('models.current_field', 'models.scalar_field'),
              ('CurrentFieldModel', 'ScalarFieldModel'),
              ('CURRENT_MODEL', 'SCALAR_MODEL'),
              ('from .api import', 'from .particle_api import'),
              ('".api"', '".particle_api"'),
              ('from .engine import', 'from .scalar_engine import'),
              ('from .scenarios import', 'from .particle_scenarios import'),
              ('from .current_field import', 'from .scalar_field import'),
          ]
          def normalized(text):
              for old, new in substitutions:
                  text = text.replace(old, new)
              tree = ast.parse(re.sub(r'\bEngine\b', 'ScalarEngine', text))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.body and isinstance(node.body[0], ast.Expr) and isinstance(node.body[0].value, ast.Constant) and isinstance(node.body[0].value.value, str):
                          node.body.pop(0)
              imports = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom))]
              rest = [node for node in tree.body if not isinstance(node, (ast.Import, ast.ImportFrom))]
              tree.body = sorted(imports, key=ast.dump) + rest
              return ast.dump(tree, include_attributes=False)
          count = 0
          for name in subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', base, 'src'], text=True).splitlines():
              path = pathlib.Path(name)
              if path.suffix != '.py':
                  continue
              target = path.with_name(names.get(path.name, path.name))
              previous = subprocess.check_output(['git', 'show', base + ':' + name], text=True)
              assert normalized(previous) == normalized(target.read_text()), name
              count += 1
          print(f'PASS: executable AST preserved in all {count} production Python modules.')
          PY
      - name: Full current-main validation
        run: python tools/check.py --base 10e5221bc9c1d1f47311785e484b2870450dba45 --full
      - name: Preserve exact checked tree
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/final-audit"
          git add -A
          tree=$(git write-tree)
          echo "$tree" > "$RUNNER_TEMP/final-audit/tree.txt"
          git archive --format=tar "$tree" | gzip > "$RUNNER_TEMP/final-audit/source.tar.gz"
          git diff --cached 10e5221bc9c1d1f47311785e484b2870450dba45 > "$RUNNER_TEMP/final-audit/cleanup.diff"
          cp artifacts/junit.xml artifacts/check-scope.json "$RUNNER_TEMP/final-audit/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-audit-current-main
          path: ${{ runner.temp }}/final-audit/
          retention-days: 1
      - name: Publish checked reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e .github/workflows/reconcile-current-main.yml
          gh auth setup-git
          git commit -m 'chore: reconcile repository naming audit with current main'
          git push origin HEAD:refs/heads/chore/repository-consistency-audit
