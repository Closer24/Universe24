name: Photon definition audit
on:
  push:
    branches: [feat/photon-field-frequency]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply reviewed preparation-only changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/photon-field-frequency
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import pathlib
          import subprocess
          base = '6a2816526083c23069bf3b0f3fcb6a9dc5b17944'
          transport = '.github/workflows/photon-definition-audit.yml'
          assert subprocess.check_output(['git', 'diff', '--name-only', base], text=True).splitlines() == [transport]
          reply = json.loads(subprocess.check_output(['gh', 'api', 'repos/Closer24/Universe24/git/blobs/9be0b2038caa8b8ec85387e5b3d00a99a64e98c9']))
          patch = lzma.decompress(base64.b64decode(base64.b64decode(reply['content'])))
          assert hashlib.sha256(patch).hexdigest() == 'ae6eda7663640e5dadf772b0c15841bd306efc5a65866938324220adc1d20e54'
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          pathlib.Path(transport).unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          assert subprocess.check_output(['git', 'write-tree'], text=True).strip() == '8223665fd446a29690f0d5c090db01a04154c407'
          assert not subprocess.check_output(['git', 'diff', '--cached', base, '--', 'src', 'tests/reference', '.github/workflows'])
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('PASS: exact reviewed tree; no engine, frozen-reference or maintained-workflow changes.')
          PY
      - run: python -m pip install -e '.[render,dev]'
      - name: Validate changed definitions and affected consumers
        run: python tools/check.py --base 6a2816526083c23069bf3b0f3fcb6a9dc5b17944
      - name: Produce the field-owned single-photon preparation without a world run
        run: |
          python examples/photon/prepare.py --catalog examples/known-entities/catalog.json --profiles examples/known-entities/representation-probes.json --output artifacts/photon-preparation
          python - <<'PY'
          import hashlib
          import json
          import pathlib
          from event_universe.configuration_validation import prepare_initialization
          from event_universe.integration.event_program import parse_event_program
          root = pathlib.Path('artifacts/photon-preparation')
          data = (root / 'initialization.json').read_bytes()
          raw = json.loads(data)
          report = json.loads((root / 'preparation.json').read_text())
          assert report['initialization_sha256'] == hashlib.sha256(data).hexdigest()
          assert report['quantum_count'] == 1
          assert report['energy']['per_quantum'] == {'numerator': 1, 'denominator': 8}
          assert report['energy']['total_above_vacuum'] == {'numerator': 1, 'denominator': 8}
          assert raw['seeds'] == [] and 'spatial_fields' not in raw
          network = parse_event_program(prepare_initialization(raw).initial).network
          assert network is not None and network.levels == (1, 0)
          assert network.register_names == ('electromagnetic_field:transverse-1', 'electromagnetic_field:transverse-2')
          print('PASS: one excitation in two parent field number modes, derived energy only; no world advanced.')
          PY
      - name: Preserve exact source, tests and preparation
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/photon-evidence"
          git add -A
          tree=$(git write-tree)
          echo "$tree" > "$RUNNER_TEMP/photon-evidence/tree.txt"
          git archive --format=tar "$tree" | gzip > "$RUNNER_TEMP/photon-evidence/source.tar.gz"
          git diff --cached 6a2816526083c23069bf3b0f3fcb6a9dc5b17944 > "$RUNNER_TEMP/photon-evidence/changes.patch"
          cp artifacts/junit.xml artifacts/check-scope.json "$RUNNER_TEMP/photon-evidence/" 2>/dev/null || true
          if [ -d artifacts/photon-preparation ]; then cp -R artifacts/photon-preparation "$RUNNER_TEMP/photon-evidence/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photon-preparation-evidence
          path: ${{ runner.temp }}/photon-evidence/
          retention-days: 1
      - name: Publish only the successfully validated isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/photon-field-frequency
          test ! -e .github/workflows/photon-definition-audit.yml
          test "$(git write-tree)" = 8223665fd446a29690f0d5c090db01a04154c407
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git commit -m 'feat: define field-owned photon preparation with rational frequency and derived energy'
          git push origin HEAD:refs/heads/feat/photon-field-frequency
