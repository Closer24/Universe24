name: Reconcile naming audit with latest main v2
on:
  push:
    branches: [chore/repository-consistency-audit]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Merge latest main and reapply naming rules
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/chore/repository-consistency-audit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-ff --no-commit -X theirs 85ec120862e5bead2c63eebfc37753b52497c0eb
          test -z "$(git diff --name-only --diff-filter=U)"
          python - <<'PY'
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          replacements = [
              ('event_universe.api', 'event_universe.particle_api'),
              ('event_universe.scenarios', 'event_universe.particle_scenarios'),
              ('core/engine.py', 'core/scalar_engine.py'),
              ('models/current_field.py', 'models/scalar_field.py'),
              ('src/event_universe/api.py', 'src/event_universe/particle_api.py'),
              ('src/event_universe/scenarios.py', 'src/event_universe/particle_scenarios.py'),
              ('test_current_field.py', 'test_scalar_field_model.py'),
              ('test_engine.py', 'test_scalar_engine.py'),
              ('test_application.py', 'test_legacy_application.py'),
              ('docs/FIELDS.md', 'docs/SCALAR_FIELDS.md'),
              ('](FIELDS.md)', '](SCALAR_FIELDS.md)'),
              ('examples/known-entities/run.py', 'examples/known-entities/run_reference_checks.py'),
              ('examples/known-entities/run.ps1', 'examples/known-entities/run_reference_checks.ps1'),
              ('examples/maxwell/run.py', 'examples/maxwell/run_experiments.py'),
              ('examples/small-space/run.py', 'examples/small-space/run_experiments.py'),
          ]

          for source, target in (
              ('examples/maxwell/run.py', 'examples/maxwell/run_experiments.py'),
              ('examples/small-space/run.py', 'examples/small-space/run_experiments.py'),
          ):
              src = root / source
              dst = root / target
              if src.exists() and not dst.exists():
                  src.rename(dst)

          for name in subprocess.check_output(['git', 'ls-files'], text=True).splitlines():
              target = root / name
              if not target.is_file() or target.suffix not in {'.py', '.md', '.ps1', '.json', '.yml', '.yaml', '.toml'}:
                  continue
              if name.startswith('tests/reference/') or name in {'docs/MIGRATION.md', 'docs/VALIDATION.md'}:
                  continue
              text = target.read_text(encoding='utf-8')
              updated = text
              for old, new in replacements:
                  updated = updated.replace(old, new)
              if updated != text:
                  target.write_text(updated, encoding='utf-8')

          docs_index = root / 'docs/README.md'
          text = docs_index.read_text(encoding='utf-8')
          if 'QUANTUM_ENTITIES.md' not in text:
              anchor = '| [Quantum events](QUANTUM_EVENTS.md)'
              assert anchor in text
              text = text.replace(anchor, '| [Quantum entities](QUANTUM_ENTITIES.md) | Quantum entity definitions and native integration ownership |\n' + anchor, 1)
              docs_index.write_text(text, encoding='utf-8')

          highlights = root / 'docs/HIGHLIGHTS_IMPLEMENTATION.md'
          text = highlights.read_text(encoding='utf-8')
          marker = '## 10. Implemented entities and rules'
          note = ('This is a dated inventory for the revision recorded above. Later native event programs,\n'
                  'quantum entity support, Maxwell research examples, local probes and internal path changes\n'
                  'are described in [project status](PROJECT_STATUS.md), [the documentation index](README.md)\n'
                  'and [migration](MIGRATION.md). Preserve this record as historical evidence rather than\n'
                  'treating its omissions as current gaps.\n\n')
          if note not in text:
              assert marker in text
              highlights.write_text(text.replace(marker, note + marker, 1), encoding='utf-8')

          status = root / 'docs/PROJECT_STATUS.md'
          text = status.read_text(encoding='utf-8')
          heading = '## Repository naming and ownership audit'
          if heading not in text:
              block = ('\n\n' + heading + '\n\n'
                       'The repository-wide naming/ownership audit is reconciled against main\n'
                       '`85ec120862e5bead2c63eebfc37753b52497c0eb`. It preserves the integrated\n'
                       'native quantum, quantum-entity and Maxwell research additions while keeping\n'
                       'one active implementation owner per documented responsibility. Historical\n'
                       'research APIs and standalone laboratories remain explicitly labeled.\n')
              status.write_text((text.rstrip() + block).rstrip() + '\n', encoding='utf-8')

          for workflow in ('.github/workflows/rebase-audit-on-main.yml', '.github/workflows/reconcile-audit-v2.yml'):
              path = root / workflow
              if path.exists():
                  path.unlink()
          PY
      - run: python -m pip install -e '.[render,dev]'
      - name: Format and verify production behavior is unchanged
        shell: bash
        run: |
          python -m ruff check --select I --fix .
          python -m ruff format .
          git diff --check
          python - <<'PY'
          import ast
          import pathlib
          import re
          import subprocess

          base = '85ec120862e5bead2c63eebfc37753b52497c0eb'
          names = {'api.py': 'particle_api.py', 'engine.py': 'scalar_engine.py', 'current_field.py': 'scalar_field.py', 'scenarios.py': 'particle_scenarios.py'}
          substitutions = [
              ('event_universe.api', 'event_universe.particle_api'),
              ('event_universe.scenarios', 'event_universe.particle_scenarios'),
              ('core.engine', 'core.scalar_engine'),
              ('models.current_field', 'models.scalar_field'),
              ('CurrentFieldModel', 'ScalarFieldModel'),
              ('CURRENT_MODEL', 'SCALAR_MODEL'),
              ('from .api import', 'from .particle_api import'),
              ('".api"', '".particle_api"'),
              ('from .engine import', 'from .scalar_engine import'),
              ('from .scenarios import', 'from .particle_scenarios import'),
              ('from .current_field import', 'from .scalar_field import'),
          ]

          def normalized(text):
              for old, new in substitutions:
                  text = text.replace(old, new)
              tree = ast.parse(re.sub(r'\bEngine\b', 'ScalarEngine', text))
              for node in ast.walk(tree):
                  if isinstance(node, (ast.Module, ast.ClassDef, ast.FunctionDef, ast.AsyncFunctionDef)):
                      if node.body and isinstance(node.body[0], ast.Expr) and isinstance(node.body[0].value, ast.Constant) and isinstance(node.body[0].value.value, str):
                          node.body.pop(0)
              imports = [node for node in tree.body if isinstance(node, (ast.Import, ast.ImportFrom))]
              rest = [node for node in tree.body if not isinstance(node, (ast.Import, ast.ImportFrom))]
              tree.body = sorted(imports, key=ast.dump) + rest
              return ast.dump(tree, include_attributes=False)

          count = 0
          for name in subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', base, 'src'], text=True).splitlines():
              path = pathlib.Path(name)
              if path.suffix != '.py':
                  continue
              target = path.with_name(names.get(path.name, path.name))
              previous = subprocess.check_output(['git', 'show', base + ':' + name], text=True)
              assert normalized(previous) == normalized(target.read_text()), name
              count += 1
          print(f'PASS: executable AST preserved in all {count} production Python modules.')
          PY
      - name: Full validation on latest-main integration
        run: python tools/check.py --base 85ec120862e5bead2c63eebfc37753b52497c0eb --full
      - name: Preserve exact checked tree
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/repository-audit"
          git add -A
          tree=$(git write-tree)
          echo "$tree" > "$RUNNER_TEMP/repository-audit/tree.txt"
          git archive --format=tar "$tree" | gzip > "$RUNNER_TEMP/repository-audit/source.tar.gz"
          git diff --cached 85ec120862e5bead2c63eebfc37753b52497c0eb > "$RUNNER_TEMP/repository-audit/cleanup.diff"
          cp artifacts/junit.xml artifacts/check-scope.json "$RUNNER_TEMP/repository-audit/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repository-audit-latest-main-v2
          path: ${{ runner.temp }}/repository-audit/
          retention-days: 1
      - name: Publish checked reconciliation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test ! -e .github/workflows/rebase-audit-on-main.yml
          test ! -e .github/workflows/reconcile-audit-v2.yml
          gh auth setup-git
          git commit -m 'chore: reconcile naming audit with latest main'
          git push origin HEAD:refs/heads/chore/repository-consistency-audit
