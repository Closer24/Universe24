name: Quantum entity validation
on:
  push:
    branches: [feat/quantum-entities-channels]
permissions:
  contents: read
jobs:
  environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[dev]'
      - name: Export only interpreter and validation dependencies
        run: |
          mkdir -p artifacts/python-environment
          python --version > artifacts/python-environment/version.txt
          tar -czf artifacts/python-environment/python.tar.gz -C "$pythonLocation" .
      - uses: actions/upload-artifact@v4
        with:
          name: quantum-python-environment
          path: artifacts/python-environment/
          retention-days: 1
