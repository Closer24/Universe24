name: Gauge loops and complete-state covariance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gauge-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install validation dependencies
        run: python -m pip install '.[validation]'
      - name: Independent gauge and counterexample regressions
        run: python -m unittest universe24.tests.test_gauge_loop -v
      - name: Fresh saved experiments and complete replay
        run: python -m validation.gauge_loop.audit --out runs/gauge-loop
      - name: Verify both distinct constructions through the supported interface
        run: |
          python -m universe24 verify --run runs/gauge-loop/static/positive
          python -m universe24 verify --run runs/gauge-loop/dynamic
          if python -m universe24 verify --run runs/gauge-loop/dynamic --require-physics; then
            echo 'Finite gauge covariance must not grant full physical acceptance'
            exit 1
          fi
      - name: Complete gauge experiment evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gauge-loop-python-${{ matrix.python }}
          path: runs/gauge-loop/
          if-no-files-found: warn
