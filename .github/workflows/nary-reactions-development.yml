name: N-ary reaction development
on:
  push:
    branches: [feat/generic-particle-reactions-final]
permissions:
  contents: write
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[dev]'
      - name: Apply bounded n-ary reaction implementation once
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing patch anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1))

          state = Path('src/event_universe/core/disturbance_state.py')
          if 'class ReactionDefinition:' not in state.read_text():
              replace_once(
                  state,
                  'MAX_RULES = 32\nMAX_EXPRESSION_NODES = 64\n',
                  'MAX_RULES = 32\nMAX_REACTION_INPUTS = 8\nMAX_REACTION_OUTPUTS = 8\nMAX_EXPRESSION_NODES = 64\n',
              )
              replace_once(
                  state,
                  '''@dataclass(frozen=True, slots=True)\nclass InteractionDefinition:\n    name: str\n    left_type: int\n    right_type: int\n    assignments: tuple[Assignment, ...]\n    invariants: tuple[Invariant, ...]\n    when: Expression | None = None\n    output_types: tuple[int, int] | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass OperationCosts:\n''',
                  '''@dataclass(frozen=True, slots=True)\nclass InteractionDefinition:\n    name: str\n    left_type: int\n    right_type: int\n    assignments: tuple[Assignment, ...]\n    invariants: tuple[Invariant, ...]\n    when: Expression | None = None\n    output_types: tuple[int, int] | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass ReactionAssignment:\n    output: int\n    field: int\n    expression: Expression\n\n\n@dataclass(frozen=True, slots=True)\nclass ReactionInvariant:\n    name: str\n    before: Expression\n    after: Expression\n\n\n@dataclass(frozen=True, slots=True)\nclass ReactionDefinition:\n    name: str\n    input_types: tuple[int, ...]\n    output_types: tuple[int, ...]\n    assignments: tuple[ReactionAssignment, ...]\n    invariants: tuple[ReactionInvariant, ...] = ()\n    when: Expression | None = None\n\n\n@dataclass(frozen=True, slots=True)\nclass OperationCosts:\n''',
              )
              replace_once(
                  state,
                  '    interactions: tuple[InteractionDefinition, ...] = ()\n    field_groups: tuple[FieldGroupDefinition, ...] = ()\n',
                  '    interactions: tuple[InteractionDefinition, ...] = ()\n    reactions: tuple[ReactionDefinition, ...] = ()\n    field_groups: tuple[FieldGroupDefinition, ...] = ()\n',
              )

              init = Path('src/event_universe/initialization.py')
              replace_once(init, '    MAX_RULES,\n    MAX_SLOTS,\n', '    MAX_RULES,\n    MAX_REACTION_INPUTS,\n    MAX_REACTION_OUTPUTS,\n    MAX_SLOTS,\n')
              replace_once(init, '    OperationCosts,\n    Payload,\n', '    OperationCosts,\n    Payload,\n    ReactionAssignment,\n    ReactionDefinition,\n    ReactionInvariant,\n')
              replace_once(
                  init,
                  '''        outgoing_fields: tuple[int, ...] = (),\n    ) -> None:\n        self.fields = fields\n        self.names = _names(fields)\n        self.owned = (left, right)\n''',
                  '''        outgoing_fields: tuple[int, ...] = (),\n        participants: tuple[tuple[int, ...], ...] | None = None,\n    ) -> None:\n        self.fields = fields\n        self.names = _names(fields)\n        self.owned = participants if participants is not None else (left, right)\n''',
              )
              replace_once(
                  init,
                  '{"field", "side", "op", "args", "index", "flux", "matrix", "received", "outgoing", "port"},',
                  '{"field", "side", "participant", "op", "args", "index", "flux", "matrix", "received", "outgoing", "port"},',
              )
              replace_once(
                  init,
                  '''    def _reference(self, obj: dict[str, object]) -> tuple[Expression, int]:\n        obj = _object(obj, "field expression", {"field", "side"}, {"field"})\n        side_name = obj.get("side", "left")\n        if side_name not in ("left", "right"):\n            raise ValueError("expression.side must be left or right")\n        side = 1 if side_name == "right" else 0\n        index = _index(obj["field"], self.names, "expression.field")\n        owned = self.owned[side]\n        if owned is None or index not in owned:\n            raise ValueError("expression references a field not owned by its participant")\n        return Expression("field", field=index, side=side), self.fields[index].components\n''',
                  '''    def _reference(self, obj: dict[str, object]) -> tuple[Expression, int]:\n        obj = _object(obj, "field expression", {"field", "side", "participant"}, {"field"})\n        if "side" in obj and "participant" in obj:\n            raise ValueError("field expression selects side or participant, not both")\n        if "participant" in obj:\n            participant = _integer(obj["participant"], "expression.participant", 0)\n        else:\n            side_name = obj.get("side", "left")\n            if side_name not in ("left", "right"):\n                raise ValueError("expression.side must be left or right")\n            participant = 1 if side_name == "right" else 0\n        if participant >= len(self.owned):\n            raise ValueError("expression.participant exceeds the configured participants")\n        index = _index(obj["field"], self.names, "expression.field")\n        owned = self.owned[participant]\n        if owned is None or index not in owned:\n            raise ValueError("expression references a field not owned by its participant")\n        return Expression("field", field=index, side=participant), self.fields[index].components\n''',
              )
              reaction_parser = r'''

def _reactions(
    value: object,
    fields: tuple[FieldDefinition, ...],
    disturbances: tuple[DisturbanceDefinition, ...],
) -> tuple[ReactionDefinition, ...]:
    """Parse bounded local n-to-m record reactions without species dispatch."""
    result: list[ReactionDefinition] = []
    type_names, field_names = _names(disturbances), _names(fields)
    required = {"name", "input_types", "output_types", "assignments"}
    for raw in _array(value, "reactions", MAX_RULES):
        obj = _object(raw, "reaction", required | {"invariants", "when"}, required)
        name = _text(obj["name"], "reaction.name")
        if any(rule.name == name for rule in result):
            raise ValueError("duplicate reaction name")
        input_types = tuple(
            _index(item, type_names, "reaction.input_type")
            for item in _array(obj["input_types"], "reaction.input_types", MAX_REACTION_INPUTS, 1)
        )
        output_types = tuple(
            _index(item, type_names, "reaction.output_type")
            for item in _array(obj["output_types"], "reaction.output_types", MAX_REACTION_OUTPUTS, 1)
        )
        inputs = tuple(disturbances[index] for index in input_types)
        outputs = tuple(disturbances[index] for index in output_types)
        involved = (*inputs, *outputs)
        if any(kind.transport.mode == "split" or kind.cost_field is not None for kind in involved):
            raise ValueError("reaction requires whole records without cost_field")
        input_owned = tuple(kind.fields for kind in inputs)
        output_owned = tuple(kind.fields for kind in outputs)

        def input_expression(raw_value: object, expected: int | None = None) -> Expression:
            return _Expressions(
                fields,
                input_owned[0],
                participants=input_owned,
            ).parse(raw_value, expected)

        assignments: list[ReactionAssignment] = []
        for raw_assignment in _array(
            obj["assignments"], "reaction.assignments", MAX_FIELDS * MAX_REACTION_OUTPUTS
        ):
            item = _object(
                raw_assignment,
                "reaction assignment",
                {"output", "field", "expression"},
                {"output", "field", "expression"},
            )
            output = _integer(item["output"], "reaction assignment.output", 0)
            if output >= len(outputs):
                raise ValueError("reaction assignment.output exceeds the output count")
            field = _index(item["field"], field_names, "reaction assignment.field")
            if field not in outputs[output].fields:
                raise ValueError("reaction assignment field must be owned by its output")
            if any(a.output == output and a.field == field for a in assignments):
                raise ValueError("duplicate reaction assignment target")
            assignments.append(
                ReactionAssignment(
                    output,
                    field,
                    input_expression(item["expression"], fields[field].components),
                )
            )
        expected = {(output, field) for output, kind in enumerate(outputs) for field in kind.fields}
        if {(a.output, a.field) for a in assignments} != expected:
            raise ValueError("reaction requires explicit assignments for every output field")

        invariants: list[ReactionInvariant] = []
        for raw_invariant in _array(obj.get("invariants", []), "reaction.invariants", MAX_FIELDS):
            item = _object(
                raw_invariant,
                "reaction invariant",
                {"name", "before", "after"},
                {"name", "before", "after"},
            )
            invariant_name = _text(item["name"], "reaction invariant.name")
            if any(invariant.name == invariant_name for invariant in invariants):
                raise ValueError("duplicate reaction invariant name")
            before = input_expression(item["before"], 1)
            after = _Expressions(
                fields,
                output_owned[0],
                participants=output_owned,
            ).parse(item["after"], 1)
            invariants.append(ReactionInvariant(invariant_name, before, after))
        when = input_expression(obj["when"], 1) if "when" in obj else None
        result.append(
            ReactionDefinition(name, input_types, output_types, tuple(assignments), tuple(invariants), when)
        )
    return tuple(result)
'''
              replace_once(init, '\n\ndef _seeds(\n', reaction_parser + '\n\ndef _seeds(\n')
              replace_once(init, '            "interactions",\n            "spatial_fields",\n', '            "interactions",\n            "reactions",\n            "spatial_fields",\n')
              replace_once(
