                  '''                frozenset(\n                    (\n                        *(rule.type_index for rule in initial.spatial_couplings),\n                        *(rule.type_index for rule in initial.spatial_interactions),\n                    )\n                ),\n                initial.reactions,\n            ),\n''',
              )

              event_program = Path('src/event_universe/integration/event_program.py')
              replace_once(
