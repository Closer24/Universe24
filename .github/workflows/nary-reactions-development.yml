name: N-ary reaction development
on:
  push:
    branches: [feat/generic-particle-reactions-final]
permissions:
  contents: write
jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -e '.[render,dev]'
      - name: Apply bounded n-ary reaction implementation once
        run: |
          python - <<'PY'
          from pathlib import Path

          if 'class ReactionDefinition:' not in Path('src/event_universe/core/disturbance_state.py').read_text():
              source = Path('tools/apply_nary_reactions_dev_source.txt').read_text()
              start_marker = "          python - <<'PY'\n"
              end_marker = "\n          PY\n"
              start = source.index(start_marker) + len(start_marker)
              end = source.index(end_marker, start)
              raw_lines = source[start:end].splitlines()
              lines = []
              delimiter = None
              for line in raw_lines:
                  if delimiter is None:
                      prepared = line[10:] if line.startswith('          ') else line
                      single = prepared.count("'''")
                      double = prepared.count('"""')
                      if single % 2:
                          delimiter = "'''"
                      elif double % 2:
                          delimiter = '"""'
                      lines.append(prepared)
                      continue
                  if delimiter in line:
                      prepared = line[10:] if line.startswith('          ') else line
                      lines.append(prepared)
                      if prepared.count(delimiter) % 2:
                          delimiter = None
                  else:
                      lines.append(line)
              if delimiter is not None:
                  raise RuntimeError('unterminated embedded triple-quoted string')
              script = '\n'.join(lines) + '\n'
              exec(compile(script, 'apply_nary_reactions_dev.py', 'exec'), {'__name__': '__main__'})

          path = Path('src/event_universe/initialization.py')
          text = path.read_text()
          old = '''        def input_expression(raw_value: object, expected: int | None = None) -> Expression:\n            return _Expressions(\n                fields,\n                input_owned[0],\n                participants=input_owned,\n            ).parse(raw_value, expected)\n'''
          new = '''        input_expressions = _Expressions(\n            fields,\n            input_owned[0],\n            participants=input_owned,\n        )\n'''
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace(
                  'input_expression(item["expression"], fields[field].components)',
                  'input_expressions.parse(item["expression"], fields[field].components)',
              )
              text = text.replace(
                  'before = input_expression(item["before"], 1)',
                  'before = input_expressions.parse(item["before"], 1)',
              )
              text = text.replace(
                  'when = input_expression(obj["when"], 1) if "when" in obj else None',
                  'when = input_expressions.parse(obj["when"], 1) if "when" in obj else None',
              )
          text = text.replace(
              '    for rule in initial.reactions:\n        if initial.schema_version != 1:\n',
              '    for reaction in initial.reactions:\n        if initial.schema_version != 1:\n',
              1,
          )
          text = text.replace(
              '        if max(len(rule.input_types), len(rule.output_types)) > initial.slots_per_cell:\n',
              '        if max(len(reaction.input_types), len(reaction.output_types)) > initial.slots_per_cell:\n',
              1,
          )
          text = text.replace(
              '        kinds = {*rule.input_types, *rule.output_types}\n',
              '        kinds = {*reaction.input_types, *reaction.output_types}\n',
              1,
          )
          path.write_text(text)
          PY
          python -m ruff check --fix src/event_universe/initialization.py
          python -m ruff format src/event_universe/core/disturbance_state.py src/event_universe/initialization.py src/event_universe/fields/ratios.py src/event_universe/fields/disturbances.py src/event_universe/fields/record_operations.py src/event_universe/disturbance_api.py src/event_universe/integration/event_program.py src/event_universe/particle_reactions.py tests/test_particle_reactions.py tests/test_nary_reactions.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/event_universe/core/disturbance_state.py src/event_universe/initialization.py src/event_universe/fields/ratios.py src/event_universe/fields/disturbances.py src/event_universe/fields/record_operations.py src/event_universe/disturbance_api.py src/event_universe/integration/event_program.py src/event_universe/particle_reactions.py tests/test_particle_reactions.py tests/test_nary_reactions.py examples/known-entities/electron-electron-scattering.json examples/known-entities/muon-decay.json docs/PARTICLE_REACTIONS.md docs/LOCAL_CONVERSIONS.md POSTULATES.md SIMULATOR_DEFINITIONS.md docs/TEST_EXPECTATIONS.md docs/ARCHITECTURE.md
            git commit -m 'Fix bounded n-to-m reaction validation typing'
            git push origin HEAD:feat/generic-particle-reactions-final
          fi
      - name: Validate focused reaction scope
        run: |
          python tools/check.py --base 992e0006469bb1156f517ae8273a80a980df7c57 --tests tests/test_nary_reactions.py tests/test_particle_reactions.py tests/test_local_conversions.py tests/test_native_event_runtime.py tests/test_quantum_entities.py tests/test_local_observer.py
      - name: Run physical reaction examples
        run: |
          rm -rf artifacts/nary-reactions
          mkdir -p artifacts/nary-reactions
          for reaction in electron-electron-scattering muon-decay; do
            python -m event_universe.particle_reactions \
              --catalog examples/known-entities/catalog.json \
              --reaction examples/known-entities/${reaction}.json \
              --output-init artifacts/nary-reactions/${reaction}-init.json \
              --output-manifest artifacts/nary-reactions/${reaction}-manifest.json
            python -m event_universe \
              --init artifacts/nary-reactions/${reaction}-init.json \
              --output artifacts/nary-reactions/${reaction}-run
          done
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/nary-reactions')
          expected = {
              'electron-electron-scattering': {
                  'charge': [-6], 'energy': [10], 'momentum': [0, 0, 0],
                  'inputs': 2, 'outputs': 2,
              },
              'muon-decay': {
                  'charge': [-3], 'energy': [12], 'momentum': [0, 0, 0],
                  'inputs': 1, 'outputs': 3,
              },
          }
          for name, values in expected.items():
              manifest = json.loads((root / f'{name}-manifest.json').read_text())
              run = json.loads((root / f'{name}-run' / 'run.json').read_text())
              assert len(manifest['inputs']) == values['inputs']
              assert len(manifest['outputs']) == values['outputs']
              assert manifest['conservation']['electric_charge_thirds']['before'] == values['charge'][0]
              assert manifest['conservation']['electric_charge_thirds']['after'] == values['charge'][0]
              assert manifest['conservation']['configured_energy']['before'] == values['energy'][0]
              assert manifest['conservation']['configured_energy']['after'] == values['energy'][0]
              assert manifest['conservation']['configured_momentum']['before'] == values['momentum']
              assert manifest['conservation']['configured_momentum']['after'] == values['momentum']
              assert run['status'] == 'completed'
              assert run['initial_totals'] == {
                  'charge': values['charge'], 'energy': values['energy'], 'momentum': values['momentum']
              }
              assert run['final_totals'] == run['initial_totals']
              assert run['conserved_at_every_completed_tick']
              assert run['accounting_balanced_at_every_completed_tick']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nary-reaction-development-evidence
          path: artifacts/
          retention-days: 1
