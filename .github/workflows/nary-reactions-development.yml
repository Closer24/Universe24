                  '''        for reaction in self.reactions:\n            remaining = list(present)\n            for type_index in reaction.input_types:\n                if type_index not in remaining:\n                    break\n                remaining.remove(type_index)\n            else:\n                return True\n        for record in records:\n            if record is not None:\n''',
