                  'uses established catalog identity as data and compiles a bounded two-to-two local\ntype replacement through that same conversion owner.',
                  'uses established catalog identity as data and compiles a bounded local n-to-m\ntype replacement through the generic reaction owner.',
              )
              text = text.replace(
                  'configured energy/momentum totals must balance before compilation and remain runtime\nconserved fields.',
                  'configured energy/momentum totals must balance before compilation and remain runtime\nconserved fields. Reaction arity is fixed by configured local capacity, not particle names.',
              )
              post.write_text(text)

              defs = Path('SIMULATOR_DEFINITIONS.md')
              text = defs.read_text()
              marker = '## '
              addition = r'''

### Bounded n-to-m reaction ownership

The active schema may declare `reactions` with one through eight local input
records and one through eight local output records. Input references use explicit
participant indices; every output-owned field must be assigned. A selected
transaction reads one frozen local input tuple, requires enough local output slots,
checks every conserved field and declared invariant, and commits all replacements
atomically. Reaction work is bounded by `MAX_RULES`, `MAX_SLOTS`, field/expression
limits and the fixed arity caps. No reaction may read remote state, repair a global
total, or infer a law from a particle/type name. This is a configuration mechanism,
not a claim that a configured reaction emerged.
'''
              if '### Bounded n-to-m reaction ownership' not in text:
                  text += addition
              defs.write_text(text)

              expectations = Path('docs/TEST_EXPECTATIONS.md')
              text = expectations.read_text()
              insert = r'''

## Bounded n-to-m reactions

`tests/test_nary_reactions.py` requires an anonymous `3 -> 2` transaction to consume
three colocated inputs once, create two outputs, preserve its conserved inventory
and clear the unused input slot. A tampered output must fail without partial commit;
reaction arity must fit `slots_per_cell`; runtime output-capacity exhaustion must
preserve every input. `tests/test_particle_reactions.py` additionally runs the
catalog electron-electron `2 -> 2` conservation topology and muon-decay `1 -> 3`
topology. These are ownership/conservation tests, not QED or weak-rate derivations.
'''
              if '## Bounded n-to-m reactions' not in text:
                  text = text.replace('\n## Generic local field rules\n', insert + '\n## Generic local field rules\n', 1)
              expectations.write_text(text)

              arch = Path('docs/ARCHITECTURE.md')
              text = arch.read_text()
              anchor = 'Optional two-record type conversion follows the existing frozen pair proposal\nand delayed engine commit; its ownership restrictions are in\n[local conversions](LOCAL_CONVERSIONS.md).\n'
              addition = '\n`reactions` adds a separate bounded n-to-m local transaction owner. Participant and output arities are fixed by validated configuration limits; particle/type names remain data. Expressions read a frozen indexed input tuple, and the existing engine still owns scheduling and atomic delayed commit.\n'
              if addition.strip() not in text:
                  text = text.replace(anchor, anchor + addition, 1)
              arch.write_text(text)

          PY
          python -m ruff format src/event_universe/core/disturbance_state.py src/event_universe/initialization.py src/event_universe/fields/ratios.py src/event_universe/fields/disturbances.py src/event_universe/fields/record_operations.py src/event_universe/disturbance_api.py src/event_universe/integration/event_program.py src/event_universe/particle_reactions.py tests/test_particle_reactions.py tests/test_nary_reactions.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/event_universe/core/disturbance_state.py src/event_universe/initialization.py src/event_universe/fields/ratios.py src/event_universe/fields/disturbances.py src/event_universe/fields/record_operations.py src/event_universe/disturbance_api.py src/event_universe/integration/event_program.py src/event_universe/particle_reactions.py tests/test_particle_reactions.py tests/test_nary_reactions.py examples/known-entities/electron-electron-scattering.json examples/known-entities/muon-decay.json docs/PARTICLE_REACTIONS.md docs/LOCAL_CONVERSIONS.md POSTULATES.md SIMULATOR_DEFINITIONS.md docs/TEST_EXPECTATIONS.md docs/ARCHITECTURE.md
            git commit -m 'Generalize local reactions to bounded n-to-m ownership'
            git push origin HEAD:feat/generic-particle-reactions-final
          fi
      - name: Validate focused reaction scope
        run: |
          python tools/check.py --base 992e0006469bb1156f517ae8273a80a980df7c57 --tests tests/test_nary_reactions.py tests/test_particle_reactions.py tests/test_local_conversions.py tests/test_native_event_runtime.py tests/test_quantum_entities.py tests/test_local_observer.py
      - name: Run physical reaction examples
        run: |
          rm -rf artifacts/nary-reactions
          mkdir -p artifacts/nary-reactions
          for reaction in electron-electron-scattering muon-decay; do
            python -m event_universe.particle_reactions \
              --catalog examples/known-entities/catalog.json \
              --reaction examples/known-entities/${reaction}.json \
              --output-init artifacts/nary-reactions/${reaction}-init.json \
              --output-manifest artifacts/nary-reactions/${reaction}-manifest.json
            python -m event_universe \
              --init artifacts/nary-reactions/${reaction}-init.json \
              --output artifacts/nary-reactions/${reaction}-run
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nary-reaction-development-evidence
          path: artifacts/
          retention-days: 1
