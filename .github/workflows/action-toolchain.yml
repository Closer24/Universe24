name: Isolated action toolchain
on:
  push:
    branches: [feat/local-shared-action]
    paths: [.github/workflows/action-toolchain.yml]
permissions:
  contents: read
jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip download --only-binary=:all: 'ruff>=0.16,<0.17' 'mypy>=2.3,<3' 'build>=1,<2' -d toolchain
      - uses: actions/upload-artifact@v4
        with:
          name: action-dev-toolchain
          path: toolchain/
          retention-days: 1
