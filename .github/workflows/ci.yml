name: Universe24 reliability
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  universe24:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install Universe24
        run: python -m pip install .
      - name: Mandatory engine, 48-channel and 2O symmetry contracts
        run: python -m unittest discover -s universe24/tests -t . -v
      - name: One-system bundle, forward run, offline decoder and exact replay
        run: |
          python -m validation.system_smoke --out runs/system-smoke
          python -m universe24 verify --run runs/system-smoke/run
          python -m universe24 status
      - name: Physical acceptance cannot be inferred from mechanical success
        run: |
          if python -m universe24 verify --run runs/system-smoke/run --require-physics; then
            echo 'Unexpected physical acceptance without independent evidence'
            exit 1
          fi
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: universe24-python-${{ matrix.python }}
          path: runs/
          if-no-files-found: warn
