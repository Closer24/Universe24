name: Reliability
on:
  pull_request:
  push:
    branches: ['main', 'research/reliability-2026-11-07', 'research/clock-selection-2026-11-08']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned research arithmetic and test solver
        run: python -m pip install --disable-pip-version-check -r research/clock_selection/requirements.txt -r research/clock_selection/requirements-solver.txt
      - name: Exact tests and evidence bundle
        run: |
          python -m research.experiments.materialize_evidence
          python -m research.experiments.materialize_evidence --check-only
          python -m research.clock_selection.archive materialize
          python -m research.clock_selection.archive materialize --check-only
          python -m research.invariant_families_v1.verify_evidence
          python -m research.reproducibility.run --output runs/first
      - name: Independent rerun of deterministic experiment outputs
        run: |
          python -m research.reproducibility.run --output runs/second --skip-tests
          python -m research.reproducibility.run --compare runs/first runs/second --compare-experiments
      - name: Evidence and failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reliability-python-${{ matrix.python }}
          path: runs/
          if-no-files-found: warn
          retention-days: 30
