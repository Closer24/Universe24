name: Eight-review algebra research
on:
  pull_request:
    paths:
      - 'validation/research_eight/**'
      - 'docs/research_eight/**'
      - '.github/workflows/research-eight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[validation]'
      - name: Run exact controls and preserve expected physical failures
        run: python -m validation.research_eight.run_all
      - name: Save research evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: research-eight-python-${{ matrix.python }}
          path: runs/research_eight/
          if-no-files-found: error
