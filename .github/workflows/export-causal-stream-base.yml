name: Export causal-stream base
on:
  push:
    branches: [feat/causal-stream-field]
    paths: [.github/workflows/export-causal-stream-base.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=tar HEAD -o /tmp/repository.tar
      - uses: actions/upload-artifact@v4
        with:
          name: causal-stream-base-source
          path: /tmp/repository.tar
          retention-days: 1
