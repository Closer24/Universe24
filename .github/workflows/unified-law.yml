name: Seven-researcher unified law
on:
  pull_request:
    paths:
      - 'validation/unified_law/**'
      - 'docs/research/unified_law/**'
      - 'universe24/tests/test_unified_law.py'
      - '.github/workflows/unified-law.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unified-law:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[validation]'
      - run: python -m validation.unified_law.run_all
      - run: python -m unittest universe24.tests.test_unified_law -v
      - run: python -m validation.system_smoke --out runs/unified_law/smoke-ci
      - run: python -m universe24 verify --run runs/unified_law/smoke-ci/run
      - name: Preserve proofs, actual-state evidence and unresolved gates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unified-law-python-${{ matrix.python }}
          path: runs/unified_law/
          if-no-files-found: error
