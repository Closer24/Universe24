name: Eight-researcher completion controls
on:
  pull_request:
    paths:
      - 'validation/completion/**'
      - 'docs/completion/**'
      - '.github/workflows/completion-eight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  completion:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[validation]'
      - name: Run eight independent audits and shared runtime handoff
        run: python -m validation.completion.run_all
      - name: Preserve exact controls and expected physical failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: completion-eight-python-${{ matrix.python }}
          path: runs/completion/
          if-no-files-found: error
