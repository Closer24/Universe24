name: Directional delay boundary audit
on:
  push:
    branches: [feat/directional-delay]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Apply the focused compatibility fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/directional-delay
          python - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import pathlib
          import subprocess
          previous = '596397ee41f1d4a226ad98ef9361660c9c3be2c9'
          transport = '.github/workflows/directional-delay-audit.yml'
          assert subprocess.check_output(['git', 'diff', '--name-only', previous], text=True).splitlines() == [transport]
          reply = json.loads(subprocess.check_output(['gh', 'api', 'repos/Closer24/Universe24/git/blobs/09b7c61e2f245c594302b5a3616f06b96fce24d2']))
          patch = lzma.decompress(base64.b64decode(base64.b64decode(reply['content'])))
          assert hashlib.sha256(patch).hexdigest() == '9aa470c8687d9c8336a3be0029d9d0cfbe40441e93f509e89e3bac4002bf3383'
          subprocess.run(['git', 'apply', '--check'], input=patch, check=True)
          subprocess.run(['git', 'apply'], input=patch, check=True)
          pathlib.Path(transport).unlink()
          assert not subprocess.check_output(['git', 'diff', previous, '--', 'tests/reference', '.github/workflows'])
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          PY
      - run: python -m pip install -e '.[render,dev]'
      - name: Check final feature and all affected consumers
        run: python tools/check.py --base 992e0006469bb1156f517ae8273a80a980df7c57
      - name: Reproduce final headless measurements
        run: |
          python examples/computational-curvature/measure.py --output artifacts/directional-delay-probe
          python - <<'PY'
          import json
          import pathlib
          report = json.loads(pathlib.Path('artifacts/directional-delay-probe/measurements.json').read_text())
          assert report['curvature_status'] == 'not_established'
          for name, result in report['cases'].items():
              assert result['completed_ticks'] == 8 and result['accounting_balanced'], name
              assert result['wave_squared_amplitude_balance_matches'], name
          assert report['cases']['legacy_fixed_control']['transverse_receipts_present']
          assert not report['cases']['locked_direction_control']['transverse_receipts_present']
          PY
      - name: Build the final distribution
        run: python -m build --outdir "$RUNNER_TEMP/distribution"
      - name: Preserve exact final tree and evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/directional-evidence"
          git add -A
          tree=$(git write-tree)
          echo "$tree" > "$RUNNER_TEMP/directional-evidence/tree.txt"
          git archive --format=tar "$tree" | gzip > "$RUNNER_TEMP/directional-evidence/source.tar.gz"
          git diff --cached 992e0006469bb1156f517ae8273a80a980df7c57 > "$RUNNER_TEMP/directional-evidence/changes.patch"
          cp artifacts/junit.xml artifacts/check-scope.json "$RUNNER_TEMP/directional-evidence/" 2>/dev/null || true
          if [ -d artifacts/directional-delay-probe ]; then cp -R artifacts/directional-delay-probe "$RUNNER_TEMP/directional-evidence/"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: directional-delay-final-evidence
          path: ${{ runner.temp }}/directional-evidence/
          retention-days: 1
      - name: Publish the checked feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/feat/directional-delay
          test ! -e .github/workflows/directional-delay-audit.yml
          test -z "$(git diff 992e0006469bb1156f517ae8273a80a980df7c57 -- tests/reference .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git commit -m 'fix: preserve no-output fixed-clock updates at the integer time limit'
          git push origin HEAD:refs/heads/feat/directional-delay
