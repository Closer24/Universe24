name: Directional delay audit
on:
  push:
    branches: [feat/directional-delay]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install 'pytest>=8,<10' 'ruff>=0.16,<0.17' 'mypy>=2.3,<3' 'build>=1,<2'
      - name: Archive interpreter and development tools only
        run: tar -czf "$RUNNER_TEMP/directional-runtime.tar.gz" -C "$pythonLocation" .
      - uses: actions/upload-artifact@v4
        with:
          name: directional-runtime
          path: ${{ runner.temp }}/directional-runtime.tar.gz
          retention-days: 1
