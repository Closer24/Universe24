name: Sourced complete-history map
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourced-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python }}
      - name: Install declared dependencies
        run: python -m pip install '.[validation]'
      - name: Full unit suite
        run: python -m unittest discover -s universe24/tests -t .
      - name: Eight sourced-map audits and source hashes
        run: python -m validation.sourced_map.run_all
      - name: Generic runtime smoke and replay
        run: |
          python -m validation.system_smoke --out runs/sourced-map/ci-smoke
          python -m universe24 verify --run runs/sourced-map/ci-smoke/run
      - name: Complete evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sourced-map-python-${{ matrix.python }}
          path: |
            runs/sourced-map/
            runs/sourced_map/
          if-no-files-found: error
