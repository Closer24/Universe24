[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-universe"
version = "1.0.0"
description = "A local integer 3D event-field research simulator"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alon Gonen", email = "alon@defounder.ai" }]
dependencies = ["numpy>=2.5.3,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-xdist>=3,<4", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.data-files]
"share/event-universe/examples" = ["examples/events/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["src"]
markers = [
    "diagnostic: the test pins a lattice reading (a level, a books number, a form, a share), a diagnostic and not a measurement; the count of these tests only falls",
]

[tool.ruff]
target-version = "py314"
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["event_universe"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/event_universe"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*", "PIL.*"]
ignore_missing_imports = true
