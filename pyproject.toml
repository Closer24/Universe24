[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-universe"
version = "0.3.1"
description = "A local integer 3D event-field research simulator"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alon Gonen", email = "alon@defounder.ai" }]
dependencies = ["numpy>=2.5.3,<3"]

[project.optional-dependencies]
render = ["matplotlib>=3.8,<4", "Pillow>=10,<13", "playwright>=1.45,<2"]
dev = ["pytest>=8,<10", "pytest-xdist>=3,<4", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "build>=1,<2"]

[project.scripts]
event-universe = "event_universe.runner:main"
event-universe-ui = "event_universe.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
event_universe = ["ui_assets/*.html", "ui_assets/*.css", "ui_assets/*.js"]

[tool.setuptools.data-files]
"share/event-universe/examples" = ["examples/events/*.json"]
"share/event-universe/examples/detector" = [
    "examples/events/detector/*.json",
    "examples/events/detector/README.md",
]

"share/event-universe/examples/detector/entities" = ["examples/events/detector/entities/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/event_universe"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*", "PIL.*"]
ignore_missing_imports = true
