[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "event-universe"
version = "0.3.1"
description = "A local integer 3D event-field research simulator"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alon Gonen", email = "alon@defounder.ai" }]
dependencies = ["numpy>=2.5.3,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
render = ["matplotlib>=3.8,<4", "Pillow>=10,<13", "playwright>=1.45,<2"]
dev = ["pytest>=8,<10", "pytest-xdist>=3,<4", "ruff>=0.16,<0.17", "mypy>=2.3,<3", "build>=1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.data-files]
"share/event-universe/examples" = ["examples/events/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The design scripts under docs/designs/ are records: some import modules deleted on
# 2026-09-26 (docs/CANCELLED_WORLDS.md) and do not run; their import order stays as written.
known-first-party = ["event_universe"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/event_universe"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "mpl_toolkits.*", "PIL.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The one module of the cancel still on disk (docs/CANCELLED_WORLDS.md section 2): imported by
# events/amplitude.py alone, whose deletion waits for the Boss's approval; not type-checked.
module = ["event_universe.events.measured"]
ignore_errors = true
