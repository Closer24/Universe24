[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "universe24"
version = "0.3.0"
description = "Universe24: exact reversible divisor-six Rule3 dynamics with a fixed local polynomial tensor"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
readme = "README.md"

[project.scripts]
universe24 = "universe24.__main__:main"

[project.optional-dependencies]
validation = ["sympy>=1.12,<2"]

[tool.setuptools.packages.find]
include = ["universe24*"]
exclude = ["universe24.tests*"]
